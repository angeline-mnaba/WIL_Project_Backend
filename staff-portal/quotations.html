<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quotations | David Wang Staff Portal</title>
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="styles.css">
    <script type="module" src="js/auth-guard.js"></script>
  </head>
  <body>
    <main class="shell">
      <section class="hero-band dashboard-header" aria-labelledby="page-title">
        <div>
          <p class="brand">David Wang Custom Furniture</p>
          <h1 id="page-title">Quotations</h1>
          <p class="subtitle">Quick quotes for prospects, ready to link to a client when they are registered.</p>
        </div>
        <a class="text-button" href="dashboard.html">Dashboard</a>
      </section>

      <section class="dashboard-panel page-content">
        <div class="quote-list-actions">
          <label for="quote-search">
            Search quotations
            <input id="quote-search" type="search" autocomplete="off" placeholder="Search by quote number, name or phone">
          </label>
          <a class="action-link" href="quotation-detail.html">New Quotation</a>
        </div>
        <p id="message" class="message" aria-live="polite"></p>

        <section class="quote-section" aria-labelledby="unlinked-title">
          <h2 id="unlinked-title">Unlinked Documents</h2>
          <ul id="unlinked-list" class="management-list quotations-list"></ul>
        </section>

        <section class="quote-section" aria-labelledby="linked-title">
          <h2 id="linked-title">Linked Documents</h2>
          <ul id="linked-list" class="management-list quotations-list"></ul>
        </section>
      </section>
    </main>
    <script type="module" src="js/quotations.js"></script>
  </body>
</html>
