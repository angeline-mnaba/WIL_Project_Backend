<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Staff Login | David Wang Staff Portal</title>
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="shell">
      <section class="hero-band" aria-labelledby="login-title">
        <p class="brand">David Wang Custom Furniture</p>
        <h1 id="login-title">Staff Login</h1>
        <p class="subtitle">Sign in with an admin-created staff account.</p>
      </section>
      <section class="page-content auth-content">
        <form id="login-form">
          <label for="email">
            Email
            <input id="email" name="email" type="email" autocomplete="email" required>
          </label>
          <label for="password">
            Password
            <input id="password" name="password" type="password" autocomplete="current-password" required>
          </label>
          <p id="error-message" class="error" aria-live="polite"></p>
          <button id="login-submit" type="submit">Log In</button>
        </form>
      </section>
    </main>
    <script type="module" src="js/login.js"></script>
  </body>
</html>
