<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard | David Wang Customer Portal</title>
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="styles.css">
    <script type="module" src="js/auth-guard.js"></script>
  </head>
  <body>
    <main class="shell">
      <section class="hero-band dashboard-header" aria-labelledby="dashboard-title">
        <div>
          <p class="brand">David Wang Custom Furniture</p>
          <h1 id="dashboard-title">My Orders</h1>
          <p class="subtitle">Track your furniture orders, payments, delivery status, and production progress.</p>
        </div>
        <div class="header-actions">
          <a class="text-button" href="support.html">Support</a>
          <button id="logout-button" class="secondary-button" type="button">Log Out</button>
        </div>
      </section>
      <section class="dashboard-panel page-content">
        <p id="loading-state" class="status-message">Loading your orders...</p>
        <p id="empty-state" class="status-message" style="display: none;">You have no active orders.</p>
        <p id="error-state" class="error-message" style="display: none;"></p>
        <div id="orders-container" class="orders-container"></div>
      </section>
    </main>
    <script type="module" src="js/dashboard.js"></script>
    <script type="module" src="js/logout.js"></script>
  </body>
</html>
