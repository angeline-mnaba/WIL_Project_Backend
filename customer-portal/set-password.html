<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Set Password | David Wang Customer Portal</title>
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="shell">
      <section class="hero-band" aria-labelledby="set-password-title">
        <p class="brand">David Wang Custom Furniture</p>
        <h1 id="set-password-title">Set Password</h1>
        <p class="subtitle">Create a password for your customer portal account.</p>
      </section>
      <section class="page-content auth-content">
        <form id="set-password-form">
          <label for="password">
            Password
            <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required>
          </label>
          <label for="confirm-password">
            Confirm Password
            <input id="confirm-password" name="confirm-password" type="password" autocomplete="new-password" minlength="8" required>
          </label>
          <p id="error-message" class="error" aria-live="polite"></p>
          <button type="submit">Set Password</button>
        </form>
      </section>
    </main>
    <script type="module" src="js/set-password.js"></script>
  </body>
</html>
